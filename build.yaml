overview: "Live TV transcode and tuner watchdog with per-stream kill."
description: >
  Shows every Live TV transcode and HDHomeRun tuner lease, flags the orphaned streams
  that no session and no recording accounts for, and kills an individual orphan so its
  tuner is released. Unlike Dashboard -> Active Sessions, this sees the ghost streams
  that have no session object at all.
